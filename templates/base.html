<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống Đánh giá Hardening</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .table-hardened th { background-color: #0d6efd; color: white; text-align: center; vertical-align: middle; }
        .table-hardened td { vertical-align: middle; }
        select.pass { background-color: #d1e7dd; color: #0f5132; font-weight: bold; }
        select.fail { background-color: #f8d7da; color: #842029; font-weight: bold; }
        select.na { background-color: #e2e3e5; color: #41464b; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🛡️ Hardening Audit System</a>
        </div>
    </nav>
    <div class="container-fluid px-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
